##################################################################################################
# regress.cfg — 8-bit timer regression configuration
##################################################################################################

# Compilation option for all testcase (Not supported yet)
cmp_opts =

# Coverage option: on | off (Not supported yet)
cov = off

# Dump wave option: on | off (Not supported yet)
wave = on

# Keywords used to classify test results when grepping log files.
# regress.pl also does a stronger structural check on the log
# (presence of "scenario finished" + absence of "** Error" / "TIMEOUT").
pass_key_word = "TEST PASSED"
fail_key_word = "TEST FAILED"

# Set verbosity option for UVM testbench (Not supported yet)
pl = UVM_LOW

tc_list {
  // ---------------- Section 1: Register tests ----------------
  default_value_register_test       , run_times=1 , run_opts= ;
  rw_register_test                  , run_times=1 , run_opts= ;
  reserved_region_test              , run_times=1 , run_opts= ;
  w1c_register_test                 , run_times=1 , run_opts= ;
  reset_on_the_fly_test             , run_times=1 , run_opts= ;
  apb_protocol_test                 , run_times=1 , run_opts= ;
  cdc_access_while_counting_test    , run_times=1 , run_opts= ;
  random_register_test              , run_times=1 , run_opts= ;

  // ---------------- Section 2: Clock divisor ----------------
  clkdiv_no_divide_test             , run_times=1 , run_opts= ;
  clkdiv_by2_test                   , run_times=1 , run_opts= ;
  clkdiv_by4_test                   , run_times=1 , run_opts= ;
  clkdiv_by8_test                   , run_times=1 , run_opts= ;
  clkdiv_reconfig_test              , run_times=1 , run_opts= ;

  // ---------------- Section 3: Counter tests ----------------
  count_up_test                     , run_times=1 , run_opts= ;
  count_down_test                   , run_times=1 , run_opts= ;
  load_counter_test                 , run_times=1 , run_opts= ;
  load_on_the_fly_test              , run_times=1 , run_opts= ;
  load_hold_test                    , run_times=1 , run_opts= ;
  timer_enable_disable_test         , run_times=1 , run_opts= ;
  counter_overflow_test             , run_times=1 , run_opts= ;
  counter_underflow_test            , run_times=1 , run_opts= ;
  count_direction_change_test       , run_times=1 , run_opts= ;
  continuous_rollover_test          , run_times=1 , run_opts= ;
  counter_random_test               , run_times=1 , run_opts= ;

  // ---------------- Section 4: Interrupt tests ----------------
  overflow_interrupt_test           , run_times=1 , run_opts= ;
  underflow_interrupt_test          , run_times=1 , run_opts= ;
  polling_mode_test                 , run_times=1 , run_opts= ;
  interrupt_clear_test              , run_times=1 , run_opts= ;
  interrupt_late_enable_test        , run_times=1 , run_opts= ;
  interrupt_both_source_test        , run_times=1 , run_opts= ;
  status_set_clear_race_test        , run_times=1 , run_opts= ;
  interrupt_clkdiv_test             , run_times=1 , run_opts= ;
}
